# The single origin the browser talks to.
#
# The SPA and the API are served from one address: static files from this
# container, /api from the Go service behind it. That is what the Go binary used
# to do by embedding the built frontend, which coupled the Go build to whether
# npm had run. A proxy gets the same property with the two builds independent.
#
# Single origin matters for more than tidiness: it removes CORS configuration
# entirely, and lets the session cookie stay SameSite=Lax with no exceptions.

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Uploads are bounded by the API too; this stops a large body reaching it.
    client_max_body_size 1m;

    # Long-lived caching is safe for hashed asset filenames, which change
    # whenever their content does.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The API. Cookies pass through unmodified because this is the same origin
    # as far as the browser is concerned.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Filing a ticket waits briefly on a durable workflow, so the proxy
        # must not give up before the API does.
        proxy_read_timeout 60s;
    }

    # Health endpoints, so an orchestrator can reach them through the proxy.
    location = /healthz { proxy_pass http://api:8080/healthz; }
    location = /readyz  { proxy_pass http://api:8080/readyz; }

    # The OpenAPI document, from the process that implements it. Same origin as
    # the documentation page, so "Try it out" sends the browser's own request
    # and there is no CORS to configure.
    location = /openapi.yaml { proxy_pass http://api:8080/openapi.yaml; }

    # Client-side routing: a deep link such as /tickets is not a file on disk
    # and must return the application shell rather than a 404.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # The shell must never be cached, or a deploy leaves browsers requesting
    # asset URLs that no longer exist.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    # Nor the documentation page. Its filename never changes, so a cached copy
    # survives a rebuild and shows a version of the page that no longer exists
    # -- which is exactly what makes "it is still broken" hard to diagnose.
    location = /docs/index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
    }
    location = /docs/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
        try_files /docs/index.html =404;
    }
}
