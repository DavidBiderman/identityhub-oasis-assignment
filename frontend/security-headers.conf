# Security headers for every document this server hands out.
#
# In its own file because nginx does not inherit them the way it looks like it
# should: `add_header` at one level is discarded entirely if the level below
# declares any `add_header` of its own. Several locations here set
# `Cache-Control`, so a server-level block would silently apply to none of them
# -- and `try_files` lands on `location = /index.html`, which is exactly one of
# those. Including this in each block is the version that actually takes effect.
#
# The API sets the same headers on its own responses. These are for the
# documents, which is where they matter: the access token lives in
# sessionStorage on a page served from here, not from the API.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;

# 'unsafe-inline' for styles because the bundler emits them; never for scripts.
# connect-src 'self' is what keeps a token from being posted to another origin.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
